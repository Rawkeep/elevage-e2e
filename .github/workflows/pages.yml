# Veröffentlicht die Demo auf GitHub Pages.
#
# EINMALIG VON HAND: Settings -> Pages -> Build and deployment -> Source
# auf "GitHub Actions" stellen. Das Token dieses Laufs darf die Pages-Seite
# nicht selbst ANLEGEN (Create Pages site: "Resource not accessible by
# integration") — es darf nur auf eine bestehende veröffentlichen. Solange
# der Schalter aus ist, scheitert der Lauf an configure-pages, und das ist
# richtig so: eine stille Weiterfahrt hieße, es sei veröffentlicht.
#
# Die Seite wird im Lauf NEU GEBAUT und gegen die eingecheckte Datei
# verglichen — eine Demo, die von der Engine abgedriftet ist, geht nicht
# online, sie lässt den Lauf scheitern.
name: Pages

on:
  push:
    branches: [claude/was-siehst-du-alles-d6d2x0, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install --quiet -e ".[dev]"
      - name: Gate — dieselben vier wie lokal
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m pytest -q
      - name: Demo bauen und auf Abdrift prüfen
        run: |
          python -m tools.baue_demo
          git diff --exit-code docs/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
